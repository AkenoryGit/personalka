# Сборка «Персоналки» при каждом push: тесты всех модулей, проверки Android (lint) и APK.
# APK лежит в артефакте сборки, а для ветки main — ещё и в релизе «Последняя сборка»:
# https://github.com/AkenoryGit/personalka/releases/download/latest-build/personalka.apk
name: Сборка

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Тесты и APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Код
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Тесты, проверки и APK
        run: ./gradlew check :androidApp:assembleDebug --console=plain --stacktrace

      - name: Отчёты при ошибке
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: APK в артефакт сборки
        uses: actions/upload-artifact@v7
        with:
          name: personalka-${{ github.run_number }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: «Последняя сборка» в релизах
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk personalka.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build personalka.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER} (версия 0.1.${GITHUB_RUN_NUMBER}) из коммита ${GITHUB_SHA::7}. Ставится поверх прежней, данные сохраняются."
