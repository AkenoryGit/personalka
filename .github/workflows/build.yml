# Сборка «Персоналки» при каждом push: тесты всех модулей, проверки Android (lint) и APK.
# APK из ветки main — в релизе «Последняя сборка», ссылка постоянная:
# https://github.com/AkenoryGit/personalka/releases/download/latest-build/personalka.apk
# Артефакты Actions не используются: их хранилище на аккаунте общее и ограничено 500 МБ.
# Итоги (тесты, lint, APK, ошибки) выводятся отметками — их видно через API без полного лога.
name: Сборка

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Тесты и APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Код
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Тесты, проверки и APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew check :androidApp:assembleDebug --console=plain --stacktrace 2>&1 | tee build-log.txt

      - name: Что внутри APK
        if: success()
        shell: bash
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          set +e
          {
            "$BT/aapt2" dump badging "$APK" | grep -E "^(package:|application-label:|application:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "allowBackup|dataExtractionRules|android:icon|roundIcon"
            "$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -iE "certificate (DN|SHA-256)|error|warning" | head -6
            echo "build-tools: $(basename "$BT"), размер APK: $(du -k "$APK" | cut -f1) КБ"
          } > apk-info.txt

      # Схему базы пишет Room при сборке (shared/data/schemas). Из облачной сессии Claude Gradle не собирает,
      # поэтому новую схему в ветку шага коммитит сама сборка. Коммит от сборки новую сборку не запускает.
      # В main схема уже должна лежать в репозитории — иначе ошибка и APK не выпускается.
      - name: Схема базы
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          CHANGED=$(git status --porcelain -- shared/data/schemas)
          if [ -z "$CHANGED" ]; then
            echo "::notice title=Схема базы::Схема в репозитории совпадает со сборкой"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error title=Схема базы::Схема в main не совпадает со сборкой: $CHANGED"
            exit 1
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/data/schemas
            git commit -m "${GITHUB_REF_NAME#step-}: схема базы из сборки ${GITHUB_RUN_NUMBER}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "::notice title=Схема базы::Новая схема закоммичена в ${GITHUB_REF_NAME}: $CHANGED"
          fi

      - name: Итоги в отметки
        if: always()
        run: python3 .github/scripts/annotate.py build-log.txt apk-info.txt

      - name: «Последняя сборка» в релизах
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk personalka.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build personalka.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER} (версия 0.1.${GITHUB_RUN_NUMBER}) из коммита ${GITHUB_SHA::7}. Ставится поверх прежней, данные сохраняются."
