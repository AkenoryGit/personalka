# Сборка «Персоналки» при каждом push: тесты всех модулей, проверки Android (lint) и APK.
# APK из ветки main — в релизе «Последняя сборка», ссылка постоянная:
# https://github.com/AkenoryGit/personalka/releases/download/latest-build/personalka.apk
# Артефакты Actions не используются: их хранилище на аккаунте общее и ограничено 500 МБ.
# Итоги (тесты, lint, APK, ошибки) выводятся отметками — их видно через API без полного лога.
name: Сборка

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Тесты и APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Код
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Тесты, проверки и APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew check :androidApp:assembleDebug --console=plain --stacktrace 2>&1 | tee build-log.txt

      - name: Что внутри APK
        if: success()
        shell: bash
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            "$BT/aapt2" dump badging "$APK" | grep -E "^(package|application-label|application:|sdkVersion|targetSdkVersion|launchable-activity)"
            echo "allowBackup: $("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -o 'allowBackup.*' | head -1)"
            "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
            echo "Размер: $(du -k "$APK" | cut -f1) КБ"
          } > apk-info.txt

      - name: Итоги в отметки
        if: always()
        run: python3 .github/scripts/annotate.py build-log.txt apk-info.txt

      - name: «Последняя сборка» в релизах
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk personalka.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build personalka.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Последняя сборка" \
            --notes "Сборка ${GITHUB_RUN_NUMBER} (версия 0.1.${GITHUB_RUN_NUMBER}) из коммита ${GITHUB_SHA::7}. Ставится поверх прежней, данные сохраняются."
