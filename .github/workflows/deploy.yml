# Выкладка сервера на VPS Planovo (ТЗ 7.4) — по образцу «Сервера» Planovo. Тесты и jar — «Сборка» (build.yml) в main.
# Здесь: «Проверка установки» — deploy/setup.sh и переключение версий на чистой Ubuntu 24.04, потом «Выкладка» —
# по SSH от root (секреты PERSONALKA_SERVER и PERSONALKA_SSH_KEY): setup.sh ставит или обновляет пользователя,
# базу, службу и блок Caddy, server.sh включает новую версию; не ответила на /health — сервер сам возвращает прежнюю.
# Без секретов выкладка пропускается. Проверка установки идёт и в ветках, где менялись deploy/ или этот файл.
name: Выкладка сервера

on:
  workflow_run:
    workflows: ["Сборка"]
    types: [completed]
    branches: [main]
  push:
    branches-ignore: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOMAIN: trener.planovo-app.ru

jobs:
  setup-check:
    name: Проверка установки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Код
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # В ветке jar — из main: проверяется установка, а сервер тот же.
      - name: Сервер из «Последней сборки»
        run: |
          gh release download latest-build --pattern personalka-server.jar
          VERSION=$(unzip -p personalka-server.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')
          [[ "$VERSION" =~ ^0\.1\.[0-9]+$ ]] || { echo "::error title=Проверка установки::Нет номера версии в personalka-server.jar"; exit 1; }
          echo "N=${VERSION#0.1.}" >> "$GITHUB_ENV"

      - name: Установка рядом с Planovo, переключение, откат
        run: |
          set -euxo pipefail
          # Здесь нарочно ломаются версия и откат — их ошибки не выносятся в итоги, чтобы не путать с выкладкой.
          # Упадёт сама проверка — шаг всё равно красный, журналы служб покажет следующий шаг.
          STOP=$(openssl rand -hex 16)
          echo "::stop-commands::$STOP"
          # Как на VPS: Caddy уже стоит, в Caddyfile — сайт Planovo.
          sudo apt-get install -y -qq --no-install-recommends caddy >/dev/null
          printf '%s\n' 'planovo.test {' '	tls internal' '	respond "planovo"' '}' | sudo tee /etc/caddy/Caddyfile >/dev/null
          sudo systemctl reload caddy
          # Ящик Planovo на сервере (как его пишет setup.sh Planovo) и свой пароль «Персоналки» — он главнее.
          sudo install -d -m 755 /etc/planovo
          printf '%s\n' 'MAIL_USER="box@mail.ru"' 'MAIL_PASSWORD="planovo-pass"' 'SMTP_HOST="smtp.mail.ru"' 'SMTP_PORT=""' 'ALERT_EMAIL="admin@example.ru"' \
            | sudo tee /etc/planovo/ops.env >/dev/null
          printf '%s\n' 'MAIL_PASSWORD="personalka-pass"' | sudo tee /root/secrets.env >/dev/null
          sudo chmod 600 /etc/planovo/ops.env /root/secrets.env
          sudo TRENER_TEST=1 TRENER_SECRETS=/root/secrets.env bash deploy/setup.sh
          sudo grep -qx 'TRENER_SMTP_PASSWORD="personalka-pass"' /etc/trener/trener.env
          sudo grep -qx 'TRENER_SMTP_USER="box@mail.ru"' /etc/trener/trener.env
          sudo grep -qx 'TRENER_SMTP_HOST="smtp.mail.ru"' /etc/trener/trener.env
          sudo grep -qx 'TRENER_MAIL_FROM="Персоналка <box@mail.ru>"' /etc/trener/trener.env
          sudo grep -qx 'TRENER_ADMIN_EMAIL="admin@example.ru"' /etc/trener/trener.env
          sudo install -d /opt/trener/releases/$N
          sudo install -m 644 personalka-server.jar /opt/trener/releases/$N/
          sudo /opt/trener/bin/server.sh switch $N
          # Ответ через Caddy по поддомену: ok и нужная версия (ответ — в переменную, чтобы grep -q не обрывал curl).
          health() {
            local body
            body=$(curl -fsSk --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/health")
            grep -qx ok <<<"$body" && grep -qx "версия 0.1.$1" <<<"$body"
          }
          planovo() { test "$(curl -fsSk --resolve planovo.test:443:127.0.0.1 https://planovo.test)" = planovo; }
          health $N
          planovo
          # Повторная установка ничего не ломает: тот же пароль базы, одна строка import, сервер отвечает.
          PASS=$(sudo cat /etc/trener/db-password)
          sudo TRENER_TEST=1 bash deploy/setup.sh
          test "$(sudo cat /etc/trener/db-password)" = "$PASS"
          test "$(grep -cxF 'import /etc/caddy/sites/*.caddy' /etc/caddy/Caddyfile)" = 1
          health $N
          planovo
          # Выкладка Planovo переписывает Caddyfile целиком (со строкой import) — сайт «Персоналки» остаётся.
          printf '%s\n' 'planovo.test {' '	tls internal' '	respond "planovo"' '}' 'import /etc/caddy/sites/*.caddy' \
            | sudo tee /etc/caddy/Caddyfile >/dev/null
          sudo systemctl reload caddy
          health $N
          planovo
          # Версия, которая не ответила своим номером, не остаётся: сервер возвращает прежнюю и помечает её упавшей.
          M=$((N + 1))
          sudo install -d /opt/trener/releases/$M
          sudo install -m 644 personalka-server.jar /opt/trener/releases/$M/
          if sudo TRENER_WAIT=20 /opt/trener/bin/server.sh switch $M; then echo "упавшая версия осталась" >&2; exit 1; fi
          test "$(readlink -f /opt/trener/current)" = /opt/trener/releases/$N
          test -f /opt/trener/releases/$M/failed
          health $N
          # Откатываться некуда — откат честно говорит об этом.
          if sudo /opt/trener/bin/server.sh rollback; then echo "откат без версии старше" >&2; exit 1; fi
          # Секреты: настройки — root и служба, пароль базы — только root; к базе trener чужие роли не подключаются.
          test "$(sudo stat -c '%a %U:%G' /etc/trener/trener.env)" = "640 root:trener"
          test "$(sudo stat -c '%a %U' /etc/trener/db-password)" = "600 root"
          sudo -u postgres psql -qc "CREATE ROLE stranger LOGIN"
          test "$(sudo -u postgres psql -tAc "SELECT has_database_privilege('stranger', 'trener', 'CONNECT')")" = f
          # Письмо о падениях без planovo-alert — только запись в журнал, не ошибка.
          sudo systemctl start trener-alert.service
          systemctl is-enabled trener caddy postgresql trener-backup.timer
          # Ночная копия (2.14): чистка ящика на поддельном IMAP, затем копия с пробой — письма файлами, тестовым
          # ключом age, частями по 4 КБ; склеенные вложения расшифровываются и читаются pg_restore.
          python3 -I deploy/test_backup_mail.py
          test "$(sudo cat /opt/trener/bin/backup.pub)" = "$(cat deploy/backup.pub)"
          sudo -u postgres psql -d trener -qc "INSERT INTO server_info (key, value) SELECT 'backup-check-' || g, repeat(E'строка\n\t', 500) FROM generate_series(1, 20) g"
          age-keygen -o backup.key 2>/dev/null
          age-keygen -y backup.key > backup-check.pub
          sudo TRENER_BACKUP_KEY="$PWD/backup-check.pub" TRENER_BACKUP_PART=4096 TRENER_BACKUP_OUTBOX=/tmp/outbox \
            /opt/trener/bin/backup.sh --probe | tee backup.log
          grep -q '^КОПИЯ: .*проба — прошла' backup.log
          sudo grep -qP '\tok\t' /var/lib/trener/backup-status
          sudo ls /var/backups/trener/ | grep -qx 'trener-.*\.dump\.age'
          test "$(sudo stat -c '%a %U' /var/backups/trener)" = "700 root"
          sudo -u postgres psql -lqt | cut -d'|' -f1 | grep -qw trener_probe && { echo "временная база осталась" >&2; exit 1; }
          sudo chmod -R a+r /tmp/outbox
          python3 -I - /tmp/outbox parts <<'PY'
          import email, email.policy, os, sys
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(dst)
          files = sorted(os.listdir(src))
          assert len(files) > 1, files
          for name in files:
              m = email.message_from_binary_file(open(os.path.join(src, name), "rb"), policy=email.policy.default)
              assert m["To"] == "box@mail.ru" and "[personalka-backup]" in m["Subject"], (m["To"], m["Subject"])
              for a in m.iter_attachments():
                  open(os.path.join(dst, a.get_filename()), "wb").write(a.get_content())
          PY
          cat parts/* | age --decrypt --identity backup.key > restored.dump
          pg_restore --list restored.dump | grep -q 'TABLE DATA public server_info'
          # Сбой (ключ испорчен) — письмо администратору и «ошибка» в отметке.
          echo nonsense > bad.pub
          sudo rm -rf /tmp/outbox
          if sudo TRENER_BACKUP_KEY="$PWD/bad.pub" TRENER_BACKUP_OUTBOX=/tmp/outbox /opt/trener/bin/backup.sh; then echo "сбой не замечен" >&2; exit 1; fi
          sudo grep -qP '\tошибка\tшифрование$' /var/lib/trener/backup-status
          sudo grep -qx 'To: admin@example.ru' /tmp/outbox/001.eml
          test "$(sudo ls /var/backups/trener | wc -l)" = 1
          echo "::$STOP::"
          echo "::notice title=Проверка установки::установка, повтор, сайт Planovo рядом, автоматический откат упавшей версии, ночная копия с пробой и письмо о её сбое — всё как надо"

      - name: Журнал при ошибке
        if: failure()
        run: |
          for unit in trener caddy postgresql; do
            body=$(sudo journalctl -u "$unit" -n 25 --no-pager 2>&1 | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Журнал $unit::$body"
          done

  deploy:
    name: Выкладка
    needs: setup-check
    # Из main: после зелёной «Сборки» или кнопкой Run workflow (первая выкладка — сразу после того, как добавлены секреты).
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Одна выкладка или откат за раз; начатую не прерывать — иначе сервер останется между версиями.
    concurrency:
      group: server
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Код
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Сервер из «Последней сборки»
        run: |
          WANT="${{ github.event.workflow_run.head_sha }}"
          TARGET=$(gh release view latest-build --json targetCommitish --jq .targetCommitish)
          if [ -n "$WANT" ] && [ "$TARGET" != "$WANT" ]; then
            echo "::notice title=Выкладка::В «Последней сборке» уже более новый коммит ${TARGET::7} — его выложит своя выкладка"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          gh release download latest-build --pattern personalka-server.jar
          VERSION=$(unzip -p personalka-server.jar META-INF/MANIFEST.MF | tr -d '\r' | sed -n 's/^Implementation-Version: //p')
          [[ "$VERSION" =~ ^0\.1\.[0-9]+$ ]] || { echo "::error title=Выкладка::Нет номера версии в personalka-server.jar"; exit 1; }
          echo "N=${VERSION#0.1.}" >> "$GITHUB_ENV"

      - name: Установка и переключение версии
        if: env.SKIP != '1'
        env:
          HOST: ${{ secrets.PERSONALKA_SERVER }}
          SSH_KEY: ${{ secrets.PERSONALKA_SSH_KEY }}
          # Ящик для писем с кодами (2.8) и копий базы (2.14): пароль приложения Mail.ru; адрес ящика и SMTP — из настроек Planovo на сервере.
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.PERSONALKA_ADMIN_EMAIL }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::notice title=Выкладка::сервер ещё не подключён (нет секретов PERSONALKA_SERVER и PERSONALKA_SSH_KEY) — пропускаю"
            exit 0
          fi
          set -euo pipefail
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          OPTS=(-i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          tar -czf deploy.tar.gz deploy
          # Секреты — файлом (не в командной строке): его читает setup.sh, после установки он удаляется.
          (umask 077; {
            printf 'MAIL_USER="%s"\n' "$(printf '%s' "$MAIL_USER" | tr -d '[:space:]"\\')"
            printf 'MAIL_PASSWORD="%s"\n' "$(printf '%s' "$MAIL_PASSWORD" | tr -d '[:space:]"\\')"
            printf 'ADMIN_EMAIL="%s"\n' "$(printf '%s' "$ADMIN_EMAIL" | tr -d '[:space:]"\\')"
          } > personalka-secrets.env)
          scp "${OPTS[@]}" personalka-server.jar deploy.tar.gz personalka-secrets.env "root@$HOST:/root/"
          rm -f personalka-secrets.env
          if ! ssh "${OPTS[@]}" "root@$HOST" "set -e
            trap 'rm -f /root/personalka-secrets.env' EXIT
            rm -rf /root/personalka-deploy && mkdir /root/personalka-deploy
            tar -xzf /root/deploy.tar.gz -C /root/personalka-deploy
            TRENER_DOMAIN=$DOMAIN TRENER_SECRETS=/root/personalka-secrets.env bash /root/personalka-deploy/deploy/setup.sh
            install -d /opt/trener/releases/$N
            install -m 644 /root/personalka-server.jar /opt/trener/releases/$N/personalka-server.jar
            rm -f /root/personalka-server.jar /root/deploy.tar.gz
            /opt/trener/bin/server.sh switch $N
            # Первая копия базы (2.14) — сразу, с пробой восстановления; дальше — таймер в 03:30.
            [ -s /var/lib/trener/backup-status ] || /opt/trener/bin/backup.sh --probe || true" 2>&1 | tee deploy.log; then
            rm -f ~/.ssh/deploy
            body=$(tail -25 deploy.log | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=Выкладка не удалась::$body"
            exit 1
          fi
          rm -f ~/.ssh/deploy
          # Журнал выкладки из облачной сессии не скачать — главное выносим в итоги сборки.
          grep '^ИТОГ: ' deploy.log | tail -1 | sed 's/^ИТОГ: /::notice title=Сервер настроен::/' || true
          grep '^КОПИЯ: ' deploy.log | tail -1 | sed 's/^КОПИЯ: /::notice title=Первая копия базы::/' || true
          grep '^СБОЙ: ' deploy.log | tail -1 | sed 's/^СБОЙ: /::warning title=Первая копия базы::/' || true
          echo "CHECK=1" >> "$GITHUB_ENV"

      - name: Снаружи по HTTPS
        if: env.CHECK == '1'
        run: |
          # Первый сертификат Let's Encrypt Caddy получает за десятки секунд.
          ok=""
          for _ in $(seq 1 18); do
            if body=$(curl -fsS --max-time 10 "https://$DOMAIN/health"); then ok=1; break; fi
            sleep 10
          done
          if [ -n "$ok" ]; then
            echo "$body"
            echo "::notice title=Выкладка::версия 0.1.$N работает: https://$DOMAIN/health"
          else
            echo "::warning title=Выкладка::сервер запущен, но https://$DOMAIN ещё не отвечает — проверьте запись A в DNS (сертификат Caddy получит сам)"
          fi
          # Planovo на том же сервере — работает как раньше.
          if curl -fsS --max-time 10 -o /dev/null https://planovo-app.ru/health; then
            echo "::notice title=Planovo::https://planovo-app.ru/health отвечает"
          else
            echo "::warning title=Planovo::https://planovo-app.ru/health не отвечает — проверить Planovo"
          fi
