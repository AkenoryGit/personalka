# «Персоналка» для iPhone в TestFlight (шаг 5.1в): после push в main GitHub собирает приложение на Mac и выгружает
# сборку в App Store Connect — через 20–40 минут она в TestFlight на телефоне. Свой Mac для этого не нужен.
# Машины Mac для открытого репозитория бесплатные. Подпись — автоматическая по ключу App Store Connect API
# (секреты ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 — их задаёт Дмитрий); без них выгрузка пропускается.
# Номер сборки — число коммитов (фаза «Build Number» в Xcode), версия — MARKETING_VERSION в iosApp/Configuration/Config.xcconfig.
# Итоги — отметками: «iPhone: TestFlight» или «iPhone: ошибка» с последними строками ошибок.
name: iPhone

on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Сборка iPhone и TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Ключ App Store Connect
        id: key
        shell: bash
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice title=iPhone::Нет секретов ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 — сборка для TestFlight пропущена"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "path=$KEY" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Код
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          # Номер сборки — число коммитов: нужна вся история.
          fetch-depth: 0

      - name: Xcode
        if: steps.key.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Java 21
        if: steps.key.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        if: steps.key.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6

      # Release-сборке Kotlin/Native мало 3 ГБ из gradle.properties (на Mac Дмитрия — 6 ГБ); у машины GitHub — 7 ГБ.
      - name: Память Gradle
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Архив
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Personalka.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee ios-log.txt | grep -E "error:|warning: .*(sign|profile)|\*\* ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" ios-log.txt

      - name: Выгрузка в TestFlight
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Personalka.xcarchive" \
            -exportOptionsPlist iosApp/Configuration/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee -a ios-log.txt | grep -E "error|Upload succeeded|EXPORT" || true
          grep -q "Upload succeeded" ios-log.txt

      # Xcode на чистой машине каждый раз создаёт новый сертификат разработчика; у Apple их число ограничено —
      # временный отзывается в конце, даже если сборка упала (шаг 5.3ж).
      - name: Отзыв временного сертификата
        if: always() && steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet --user pyjwt cryptography
          python3 .github/scripts/revoke_runner_cert.py "${{ steps.key.outputs.path }}"

      - name: Итоги в отметки
        if: always() && steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          INFO="$RUNNER_TEMP/Personalka.xcarchive/Info.plist"
          if grep -q "Upload succeeded" ios-log.txt 2>/dev/null; then
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$INFO")
            BUILD=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$INFO")
            echo "::notice title=iPhone: TestFlight::Сборка $VERSION ($BUILD) выгружена; после обработки Apple (10–30 мин) — в TestFlight"
          else
            ERRORS=$(grep -E "error:|error " ios-log.txt 2>/dev/null | grep -v "^\s*$" | sort -u | tail -15)
            if grep -q "maximum number of certificates" ios-log.txt 2>/dev/null; then
              ERRORS="Лимит сертификатов разработчика: отзовите старые «Apple Development» на developer.apple.com → Certificates и перезапустите сборку."$'\n'"$ERRORS"
            fi
            ERRORS="${ERRORS//'%'/'%25'}"
            ERRORS="${ERRORS//$'\n'/'%0A'}"
            echo "::error title=iPhone: ошибка::${ERRORS:-нет журнала сборки}"
          fi
          rm -f "${{ steps.key.outputs.path }}"
