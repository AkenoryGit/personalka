# Ручная кнопка «Откат сервера» (ТЗ 7.4): Actions → «Откат сервера» → Run workflow.
# Включает ближайшую младшую версию, которая не падала, и проверяет /health (deploy/server.sh rollback).
# Схема базы назад не откатывается: новые версии только добавляют таблицы и столбцы.
name: Откат сервера

on:
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Откат
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Откат на предыдущую версию
        env:
          HOST: ${{ secrets.PERSONALKA_SERVER }}
          SSH_KEY: ${{ secrets.PERSONALKA_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error title=Откат::нет секретов PERSONALKA_SERVER и PERSONALKA_SSH_KEY"
            exit 1
          fi
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "root@$HOST" /opt/trener/bin/server.sh rollback
          rm -f ~/.ssh/deploy
