<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кабинет — согласие отозвано</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface-alt:#eae6dc;--divider:#dcd9d0;--text:#15171a;--text-muted:#69665e;color-scheme:light;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font:400 16px/24px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface-alt:#2a2d31;--divider:#34373b;--text:#f3efe6;--text-muted:#98958d;color-scheme:dark}
.scr *{box-sizing:border-box}
.pg{max-width:440px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}
.bar{height:56px;display:flex;align-items:center;gap:10px;font:500 16px/24px var(--ff)}
.lgr{stroke:var(--divider);stroke-width:2}
h1{margin:0;font:500 26px/32px var(--ff)}
p{margin:0}
.mut{color:var(--text-muted)}
.num{font-variant-numeric:tabular-nums}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{width:64px;height:64px;border-radius:999px;background:var(--surface-alt);display:grid;place-items:center;margin-top:72px}
</style>
</helmet>
<div class="scr {{t}}" style="width: 390px; height: 844px">
<div class="pg">

  <div class="bar">
    <svg width="28" height="28" viewBox="0 0 72 72" aria-hidden="true"><rect class="lgr" x="1" y="1" width="70" height="70" rx="16" fill="#F3EFE6"></rect><path d="M23 53 V21 H49 V53" fill="none" stroke="#15171A" stroke-width="8"></path><circle cx="36" cy="47" r="5" fill="#FF5A1F"></circle></svg>
    <span>Кабинет тренировок</span>
  </div>

  <div class="badge"><svg class="ic" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
  <h1>Согласие отозвано</h1>
  <p class="num">Кабинет закрыт. Тренер удалит данные ребёнка до 19.11.2026.</p>
  <p class="mut">Если передумаете, напишите тренеру — он пришлёт новую ссылку.</p>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { t: (this.props.dark ?? false) ? 'dk' : 'lt' };
  }
}
</script>
</body>
</html>
