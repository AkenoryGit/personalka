.n{font:500 13px/16px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.m{font:400 13px/16px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bgs{position:absolute;top:3px;right:3px;display:flex;gap:2px}
.bd{width:16px;height:16px;border-radius:999px;background:var(--surface);display:grid;place-items:center}
.bd .ms{font-size:12px;font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 20}
.dot{width:6px;height:6px;border-radius:999px;background:var(--accent-graphic)}
.c-done{color:var(--done)}.c-chg{color:var(--charged)}.c-over{color:var(--over)}.c-mut{color:var(--text-muted)}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--accent-graphic)}
