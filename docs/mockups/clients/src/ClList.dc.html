<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Клиенты — список</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--primary:#15171a;--on-primary:#f3efe6;--accent:#ff5a1f;--on-accent:#15171a;--accent-graphic:#f55111;--done:#007634;--done-container:#d0f0d5;--on-done-container:#1b5b2f;--charged-container:#fce2c3;--on-charged-container:#6b4300;--scrim:#15171a66;--shadow-raised:0 2px 6px rgba(21,23,26,.18);--type-blue-stripe:#2d84e0;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface:#1e2124;--surface-alt:#2a2d31;--divider:#34373b;--outline:#72767c;--text:#f3efe6;--text-muted:#98958d;--primary:#f3efe6;--on-primary:#15171a;--accent:#ff5a1f;--on-accent:#15171a;--accent-graphic:#ff5a1f;--done:#64b376;--done-container:#1c3e24;--on-done-container:#c2e1c7;--charged-container:#48300d;--on-charged-container:#eed3b2;--scrim:#000000a3;--shadow-raised:0 2px 6px rgba(0,0,0,.5);--type-blue-stripe:#57a1f6}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center;flex:none}
.sp{flex:1 1 auto}
.ab{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;box-sizing:border-box}
.ab h1{margin:0;padding-left:12px;font:500 22px/28px var(--ff);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{position:absolute;left:16px;right:16px;height:48px;border-radius:12px;background:var(--surface-alt);display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box;color:var(--text-muted);font:400 15px/22px var(--ff)}
.srch .ms{font-size:20px}
.fl{position:absolute;left:0;right:0;display:flex;gap:8px;overflow:hidden;white-space:nowrap;padding:0 16px}
.ch{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--surface-alt);color:var(--text);font:500 13px/18px var(--ff);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.ch.on{background:var(--primary);color:var(--on-primary);padding-left:10px}
.ch .ms{font-size:18px}
.sbar{position:absolute;left:0;right:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;box-sizing:border-box}
.cap{font:400 13px/18px var(--ff);color:var(--text-muted);font-variant-numeric:tabular-nums}
.scroll{position:absolute;left:0;right:0;overflow:hidden;box-sizing:border-box}
.gb{background:var(--surface);border-radius:12px;overflow:hidden}
.cr{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;width:100%;border:0;background:transparent;color:var(--text);text-align:left;box-sizing:border-box;position:relative;font:400 15px/22px var(--ff)}
.cr + .cr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--divider)}
.ct{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.nm{font:500 15px/22px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font:400 13px/18px var(--ff);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rt{flex:none;font:400 13px/18px var(--ff);color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.st{height:28px;padding:0 10px 0 8px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;font:500 13px/18px var(--ff);box-sizing:border-box;white-space:nowrap;flex:none}
.st .ms{font-size:16px}
.st.plan{box-shadow:inset 0 0 0 1px var(--outline);color:var(--text)}
.fade{position:absolute;left:0;right:0;height:32px;background:linear-gradient(to bottom,transparent,var(--bg));pointer-events:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;background:var(--surface);border-top:1px solid var(--divider)}
.it{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:0;background:transparent;color:var(--text-muted);font:500 13px/16px var(--ff)}
.pill{position:relative;width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.it.on{color:var(--text)}
.it.on .pill{background:var(--surface-alt)}
.it.on .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.cnt{position:absolute;top:-2px;left:32px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font:500 13px/20px var(--ff);text-align:center;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="scr {{t}}" style="width: 412px; height: 960px">

    <div class="gb">
      <button class="cr" type="button"><span class="ct"><span class="nm">Белова Ева</span><span class="sub">1 год · Вт, Чт 10:00 · Груд ДБ</span></span><span class="rt">чт 22.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Гусев Сергей</span><span class="sub">41 год · Ср 19:00 · ПТ Зал</span></span><span class="rt">ср 21.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Дельфенурова Аделина</span><span class="sub">9 лет · Сб 09:00 · Группа ББ</span></span><span class="rt">сб 24.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Зайцева Мария</span><span class="sub">36 лет · Вт, Чт 10:00 · ПТ ББ</span></span><span class="rt">чт 22.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Захаров Никита</span><span class="sub">13 лет · без расписания</span></span><span class="st plan"><span class="ms">event_busy</span>Нет записи</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Ильин Матвей</span><span class="sub">8 лет · Вт, Пт 16:00 · Мини ДБ</span></span><span class="rt">сегодня 16:00</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Кириллова Анна</span><span class="sub">47 лет · Ср 17:00 · ПТ ББ</span></span><span class="rt">ср 21.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Ковалёв Артём</span><span class="sub">10 лет · Вт, Чт 09:00 · Сплит ББ</span></span><span class="rt">чт 22.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Ковалёва Алиса</span><span class="sub">12 лет · Вт, Чт 09:00 · Сплит ББ</span></span><span class="rt">чт 22.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Ковалёва Наталья</span><span class="sub">41 год · Пн, Ср 07:00 · ПТ ББ</span></span><span class="rt">ср 21.10</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Лаптев Егор</span><span class="sub">9 лет · Вт, Пт 16:00 · Мини ДБ</span></span><span class="rt">сегодня 16:00</span></button>
      <button class="cr" type="button"><span class="ct"><span class="nm">Лебедева Ольга</span><span class="sub">52 года · Ср 19:00 · ПТ ББ</span></span><span class="rt">ср 21.10</span></button>
    </div>
  </div>
  <div class="fade" style="bottom: 72px"></div>

  <nav class="nav">
    <button class="it" type="button"><span class="pill"><span class="ms">home</span><span class="cnt">3</span></span>Главная</button>
    <button class="it" type="button"><span class="pill"><span class="ms">calendar_month</span></span>Календарь</button>
    <button class="it on" type="button"><span class="pill"><span class="ms">group</span></span>Клиенты</button>
    <button class="it" type="button"><span class="pill"><span class="ms">payments</span></span>Зарплата</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":412,"height":960}}'>
