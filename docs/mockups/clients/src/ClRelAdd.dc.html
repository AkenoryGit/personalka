<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Добавить родственника</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--primary:#15171a;--on-primary:#f3efe6;--scrim:#15171a66;--shadow-sheet:0 -4px 16px rgba(21,23,26,.12);position:relative;overflow:hidden;background:var(--bg);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface:#1e2124;--surface-alt:#2a2d31;--divider:#34373b;--outline:#72767c;--text:#f3efe6;--text-muted:#98958d;--primary:#f3efe6;--on-primary:#15171a;--scrim:#000000a3;--shadow-sheet:0 -4px 16px rgba(0,0,0,.5)}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center;flex:none}
.sp{flex:1 1 auto}
.ab{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;box-sizing:border-box}
.head{position:absolute;left:0;right:0;padding:0 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.who{margin:0;font:500 22px/28px var(--ff)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap{font:400 13px/18px var(--ff);color:var(--text-muted);font-variant-numeric:tabular-nums}
.lbl{font:500 13px/18px var(--ff);color:var(--text-muted)}
.st{height:28px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;font:500 13px/18px var(--ff);box-sizing:border-box;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--outline)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:12px;padding:10px 4px}
.stat{display:flex;flex-direction:column;align-items:center;text-align:center}
.stat b{font:500 17px/24px var(--ff);font-variant-numeric:tabular-nums}
.stat span{font:400 13px/18px var(--ff);color:var(--text-muted)}
.scrim{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--scrim)}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-sheet);box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
.handle{width:32px;height:4px;border-radius:999px;background:var(--outline);align-self:center;margin:8px 0;flex:none}
.hd{display:flex;align-items:center;padding:0 16px 0 4px}
.ttl{margin:0 0 0 4px;font:500 17px/24px var(--ff);flex:1 1 auto}
.pad{padding:8px 16px 16px;display:flex;flex-direction:column;gap:16px}
.grp{display:flex;flex-direction:column;gap:6px}
.box{min-height:56px;box-sizing:border-box;padding:0 16px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--primary);display:flex;align-items:center;gap:8px;font:400 15px/22px var(--ff);color:var(--text)}
.box .ms{font-size:20px;color:var(--text-muted);flex:none}
.caret{display:inline-block;width:2px;height:20px;background:var(--primary);vertical-align:-4px;margin-left:1px}
.res{display:flex;flex-direction:column}
.pk{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:var(--text);width:100%;text-align:left;box-sizing:border-box;font:400 15px/22px var(--ff)}
.pk.on{background:var(--surface-alt)}
.pk .ct{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pk .ms{font-size:24px;color:var(--text-muted);flex:none;width:24px}
.pk.on .ms{color:var(--text)}
.pk.off{color:var(--text-muted)}
.nm{font:500 15px/22px var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.off .nm{font-weight:400}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--surface-alt);color:var(--text);font:500 13px/18px var(--ff);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch.on{background:var(--primary);color:var(--on-primary);padding-left:10px}
.ch .ms{font-size:18px}
.note{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;font:400 13px/18px var(--ff);background:var(--surface-alt);color:var(--text)}
.note .ms{font-size:18px;flex:none;color:var(--text-muted)}
.note b{font-weight:500}
.foot{margin-top:auto;padding:12px 16px 20px;border-top:1px solid var(--divider)}
.btn{height:48px;padding:0 20px;border:0;border-radius:12px;font:500 15px/22px var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.b-main{background:var(--primary);color:var(--on-primary)}
</style>
</helmet>
<div class="scr {{t}}" style="width: 412px; height: 960px">

  <div class="ab">
    <button class="ib" type="button" aria-label="Назад"><span class="ms">arrow_back</span></button>
    <span class="sp"></span>
    <button class="ib" type="button" aria-label="Ещё действия"><span class="ms">more_vert</span></button>
  </div>
  <div class="head" style="top: 64px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 class="who">Ковалёв Артём</h1>
      <div class="row"><span class="st">Ребёнок</span><span class="cap">10 лет · Вт, Чт 09:00 · Сплит ББ</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b>58</b><span>проведено</span></div>
      <div class="stat"><b>4</b><span>отменено</span></div>
      <div class="stat"><b>1</b><span>со списанием</span></div>
      <div class="stat"><b>8,0</b><span>в месяц</span></div>
    </div>
  </div>

  <div class="scrim"></div>

  <div class="sh" role="dialog" aria-label="Родственник для Ковалёва Артёма" style="top: 232px">
    <span class="handle"></span>
    <div class="hd">
      <button class="ib" type="button" aria-label="Закрыть"><span class="ms">close</span></button>
      <h2 class="ttl">Родственник для Артёма</h2>
    </div>

    <div class="pad">
      <div class="grp">
        <span class="lbl">Кто</span>
        <div class="box"><span class="ms">search</span><span>Ковалёва<span class="caret"></span></span></div>
        <div class="res">
          <button class="pk on" type="button" aria-pressed="true"><span class="ms">check_circle</span><span class="ct"><span class="nm">Ковалёва Наталья</span><span class="cap">41 год · Пн, Ср 07:00 · ПТ ББ</span></span></button>
          <div class="pk off" aria-disabled="true"><span class="ms">link</span><span class="ct"><span class="nm">Ковалёва Алиса</span><span class="cap">Уже сестра</span></span></div>
          <button class="pk" type="button"><span class="ms">person_add</span><span class="ct"><span>Новый клиент: Ковалёва…</span></span></button>
        </div>
      </div>

      <div class="grp">
        <span class="lbl">Кем приходится Артёму</span>
        <div class="chs">
          <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>Мать</button>
          <button class="ch" type="button">Бабушка</button>
          <button class="ch" type="button">Сестра</button>
          <button class="ch" type="button">Тётя</button>
          <button class="ch" type="button">Двоюродная сестра</button>
          <button class="ch" type="button">Другое…</button>
        </div>
      </div>

      <div class="note"><span class="ms">sync_alt</span><span>У Натальи появится: <b>Сын · Ковалёв Артём</b></span></div>
    </div>

    <div class="foot"><button class="btn b-main" type="button" style="width: 100%">Сохранить</button></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":412,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { t: (this.props.dark ?? false) ? 'dk' : 'lt' };
  }
}
</script>
</body>
</html>
