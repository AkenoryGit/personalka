<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Первый запуск — календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--accent:#ff5a1f;--on-accent:#15171a;--accent-graphic:#f55111;--past-tint:#f3f2ef;--inverse-surface:#15171a;--inverse-text:#f3efe6;--inverse-action:#ff5a1f;--shadow-raised:0 2px 6px rgba(21,23,26,.18);position:relative;overflow:hidden;background:var(--bg);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface:#1e2124;--surface-alt:#2a2d31;--divider:#34373b;--outline:#72767c;--text:#f3efe6;--text-muted:#98958d;--accent:#ff5a1f;--on-accent:#15171a;--accent-graphic:#ff5a1f;--past-tint:#171a1c;--inverse-surface:#f3efe6;--inverse-text:#15171a;--inverse-action:#ba3800;--shadow-raised:0 2px 6px rgba(0,0,0,.5)}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.tb{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:4px;padding:0 8px;box-sizing:border-box}
.mo{height:48px;padding:0 4px 0 8px;border:0;border-radius:12px;background:transparent;color:var(--text);font:500 17px/24px var(--ff);display:inline-flex;align-items:center}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center}
.dd{height:36px;padding:0 4px 0 12px;border:0;border-radius:8px;background:var(--surface-alt);color:var(--text);font:500 13px/18px var(--ff);display:inline-flex;align-items:center}
.dd .ms,.mo .ms{font-size:20px}
.sp{flex:1 1 auto}
.wk{position:absolute;left:0;right:0;height:64px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 8px;box-sizing:border-box}
.wd{margin:4px 2px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--text-muted);font:400 13px/18px var(--ff);display:flex;flex-direction:column;align-items:center;justify-content:center}
.wd.sel{background:var(--surface-alt)}
.nu{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font:500 17px/24px var(--ff);color:var(--text);font-variant-numeric:tabular-nums}
.nu.td{background:var(--accent);color:var(--on-accent)}
.gr{position:absolute;left:0;right:0;overflow:hidden;background:var(--surface)}
.tc{position:absolute;left:0;top:0;bottom:0;width:48px}
.tl{position:absolute;right:6px;transform:translateY(-50%);font:400 13px/18px var(--ff);color:var(--text-muted);font-variant-numeric:tabular-nums}
.col{position:absolute;top:0;bottom:0}
.past{position:absolute;left:0;right:0;top:0;background:var(--past-tint)}
.lines{position:absolute;left:0;right:0;top:0;bottom:0}
.hr{height:64px;box-sizing:border-box;border-top:1px solid var(--divider);position:relative}
.hr::after{content:"";position:absolute;left:0;right:0;top:31px;border-top:1px dashed var(--divider)}
.ghost{position:absolute;box-sizing:border-box;border-radius:6px;border:1px dashed var(--outline);background:var(--surface);color:var(--text-muted);font:400 13px/16px var(--ff);padding:6px 9px;display:flex;align-items:flex-start;gap:6px}
.ghost .ms{font-size:18px}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--accent-graphic)}
.now::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:999px;background:var(--accent-graphic)}
.tip{position:absolute;left:16px;right:16px;padding:12px 8px 8px 16px;border-radius:12px;background:var(--inverse-surface);color:var(--inverse-text);box-shadow:var(--shadow-raised);box-sizing:border-box;display:flex;flex-direction:column;gap:4px;font:400 15px/22px var(--ff)}
.tip::after{content:"";position:absolute;left:120px;bottom:-6px;width:12px;height:12px;background:var(--inverse-surface);transform:rotate(45deg)}
.tip .tr{display:flex;justify-content:flex-end}
.tip button{height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--inverse-action);font:500 15px/22px var(--ff)}
.fab{position:absolute;width:56px;height:56px;padding:0;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-raised);display:grid;place-items:center}
.fab .ms{font-size:28px}
.nav{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;background:var(--surface);border-top:1px solid var(--divider)}
.it{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:0;background:transparent;color:var(--text-muted);font:500 13px/16px var(--ff)}
.pill{position:relative;width:56px;height:32px;border-radius:999px;display:grid;place-items:center}
.it.on{color:var(--text)}
.it.on .pill{background:var(--surface-alt)}
.it.on .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.cnt{position:absolute;top:-2px;left:32px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--accent);color:var(--on-accent);font:500 13px/20px var(--ff);text-align:center;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="scr {{t}}" style="width: 412px; height: 960px">

  <div class="tb">
    <button class="mo" type="button">Октябрь 2026<span class="ms">arrow_drop_down</span></button>
    <span class="sp"></span>
    <button class="ib" type="button" aria-label="Сегодня"><span class="ms">today</span></button>
    <button class="dd" type="button">День<span class="ms">arrow_drop_down</span></button>
    <button class="dd" type="button">Все места<span class="ms">arrow_drop_down</span></button>
  </div>

  <div class="wk" style="top: 56px">
    <button class="wd" type="button">пн<span class="nu">19</span></button>
    <button class="wd sel" type="button">вт<span class="nu td">20</span></button>
    <button class="wd" type="button">ср<span class="nu">21</span></button>
    <button class="wd" type="button">чт<span class="nu">22</span></button>
    <button class="wd" type="button">пт<span class="nu">23</span></button>
    <button class="wd" type="button">сб<span class="nu">24</span></button>
    <button class="wd" type="button">вс<span class="nu">25</span></button>
  </div>

  <div class="gr" style="top: 120px; height: 768px">
    <div class="tc">
      <span class="tl" style="top: 2px; transform: none">08:00</span>
      <span class="tl" style="top: 64px">09:00</span>
      <span class="tl" style="top: 128px">10:00</span>
      <span class="tl" style="top: 192px">11:00</span>
      <span class="tl" style="top: 256px">12:00</span>
      <span class="tl" style="top: 320px">13:00</span>
      <span class="tl" style="top: 384px">14:00</span>
      <span class="tl" style="top: 448px">15:00</span>
      <span class="tl" style="top: 512px">16:00</span>
      <span class="tl" style="top: 576px">17:00</span>
      <span class="tl" style="top: 640px">18:00</span>
      <span class="tl" style="top: 704px">19:00</span>
    </div>
    <div class="col" style="left: 48px; right: 0px">
      <div class="past" style="height: 490.67px"></div>
      <div class="lines">
        <div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div>
        <div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div><div class="hr"></div>
      </div>
      <div class="ghost" style="top: 576px; height: 53.33px; left: 8px; right: 8px" aria-hidden="true"><span class="ms">touch_app</span>17:00–17:50</div>
      <div class="now" style="top: 489.67px"></div>
    </div>
  </div>

  <div class="tip" role="status" style="top: 574px">
    <span>Удерживайте пустое место, чтобы добавить тренировку</span>
    <div class="tr"><button type="button">Понятно</button></div>
  </div>

  <button class="fab" type="button" aria-label="Новая тренировка" style="left: 340px; top: 816px"><span class="ms">add</span></button>

  <nav class="nav">
    <button class="it" type="button"><span class="pill"><span class="ms">home</span><span class="cnt">1</span></span>Главная</button>
    <button class="it on" type="button"><span class="pill"><span class="ms">calendar_month</span></span>Календарь</button>
    <button class="it" type="button"><span class="pill"><span class="ms">group</span></span>Клиенты</button>
    <button class="it" type="button"><span class="pill"><span class="ms">payments</span></span>Зарплата</button>
    <button class="it" type="button"><span class="pill"><span class="ms">more_horiz</span></span>Ещё</button>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":412,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { t: (this.props.dark ?? false) ? 'dk' : 'lt' };
  }
}
</script>
</body>
</html>
