<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Первый запуск — места и типы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--primary:#15171a;--on-primary:#f3efe6;--type-blue-stripe:#2d84e0;--type-indigo-stripe:#7377e1;--type-lime-stripe:#6a9000;--type-green-stripe:#149848;--type-pink-stripe:#cf588d;--type-slate-stripe:#738497;--type-teal-stripe:#00929a;--type-magenta-stripe:#bb59c1;--type-brown-stripe:#a2795e;position:relative;overflow:hidden;background:var(--bg);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface:#1e2124;--surface-alt:#2a2d31;--divider:#34373b;--outline:#72767c;--text:#f3efe6;--text-muted:#98958d;--primary:#f3efe6;--on-primary:#15171a;--type-blue-stripe:#57a1f6;--type-indigo-stripe:#8c93f4;--type-lime-stripe:#87ae39;--type-green-stripe:#52b76d;--type-pink-stripe:#e275a3;--type-slate-stripe:#90a0b2;--type-teal-stripe:#2cb2bb;--type-magenta-stripe:#d077d5;--type-brown-stripe:#bc957c}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center;flex:none}
.ab{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px 0 4px;box-sizing:border-box}
.prog{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.prog span{height:4px;border-radius:999px;background:var(--primary)}
.pad{position:absolute;left:0;right:0;padding:0 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.pad h1{margin:0;font:500 22px/28px var(--ff)}
.cap{font:400 13px/18px var(--ff);color:var(--text-muted);font-variant-numeric:tabular-nums}
.lbl{font:500 13px/18px var(--ff);color:var(--text-muted)}
.grp{display:flex;flex-direction:column;gap:6px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--surface-alt);color:var(--text);font:500 13px/18px var(--ff);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch.on{background:var(--primary);color:var(--on-primary);padding-left:10px}
.ch .ms{font-size:18px}
.gb{background:var(--surface);border-radius:12px;overflow:hidden}
.tr{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;width:100%;border:0;background:transparent;color:var(--text);text-align:left;box-sizing:border-box;position:relative;font:400 15px/22px var(--ff)}
.tr + .tr::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:1px solid var(--divider)}
.cb{width:20px;height:20px;border-radius:4px;flex:none;display:grid;place-items:center;box-sizing:border-box;background:var(--primary);color:var(--on-primary)}
.cb .ms{font-size:18px}
.tdot{width:10px;height:10px;border-radius:999px;flex:none}
.nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .cap{flex:none}
.tr.add{color:var(--text)}
.tr.add .ms{font-size:20px;color:var(--text-muted)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--divider);display:flex;gap:8px;box-sizing:border-box}
.btn{height:48px;padding:0 16px;border:0;border-radius:12px;font:500 15px/22px var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap}
.btn .ms{font-size:20px}
.b-main{background:var(--primary);color:var(--on-primary)}
.b-outline{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--outline)}
</style>
</helmet>
<div class="scr {{t}}" style="width: 412px; height: 960px">

  <div class="ab">
    <button class="ib" type="button" aria-label="Назад"><span class="ms">arrow_back</span></button>
    <div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" aria-label="Шаг 2 из 2"><span></span><span></span></div>
  </div>

  <div class="pad" style="top: 80px">
    <span class="cap">Шаг 2 из 2</span>
    <h1>Места и типы</h1>
    <span class="cap" style="margin-top: -4px">Обычный набор клуба уже заполнен. Лишнее снимите, остальное поправите потом в настройках.</span>

    <div class="grp" style="margin-top: 4px">
      <span class="lbl">Места</span>
      <div class="chs">
        <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>ББ</button>
        <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>ДБ</button>
        <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>Зал</button>
        <button class="ch" type="button"><span class="ms">add</span>Место</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Типы тренировок</span>
      <div class="gb">
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-blue-stripe)"></span><span class="nm">ПТ</span><span class="cap">50 мин · 1 клиент</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-indigo-stripe)"></span><span class="nm">Сплит</span><span class="cap">50 мин · 2 клиента</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-lime-stripe)"></span><span class="nm">Мини-группа</span><span class="cap">50 мин · группа</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-green-stripe)"></span><span class="nm">Группа</span><span class="cap">60 мин · группа</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-pink-stripe)"></span><span class="nm">СПТ</span><span class="cap">50 мин · пробная</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-slate-stripe)"></span><span class="nm">Дежурство</span><span class="cap">оплата за час</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-teal-stripe)"></span><span class="nm">Грудничковое</span><span class="cap">30 мин · 1 клиент</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-magenta-stripe)"></span><span class="nm">Гидрореабилитация</span><span class="cap">50 мин · 1 клиент</span></button>
        <button class="tr" type="button" role="checkbox" aria-checked="true"><span class="cb"><span class="ms">check</span></span><span class="tdot" style="background: var(--type-brown-stripe)"></span><span class="nm">Кинезио</span><span class="cap">50 мин · 1 клиент</span></button>
        <button class="tr add" type="button"><span class="ms">add</span><span class="nm">Новый тип</span></button>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn b-outline" type="button"><span class="ms">download</span>Шаблон клуба</button>
    <button class="btn b-main" type="button" style="flex: 1 1 auto">Готово</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":412,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { t: (this.props.dark ?? false) ? 'dk' : 'lt' };
  }
}
</script>
</body>
</html>
