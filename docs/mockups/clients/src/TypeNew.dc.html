body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--primary:#15171a;--on-primary:#f3efe6;--type-red-stripe:#e44b4a;--type-orange-stripe:#d45e00;--type-amber-stripe:#b47500;--type-mustard-stripe:#978200;--type-lime-stripe:#6a9000;--type-green-stripe:#149848;--type-emerald-stripe:#2b9475;--type-teal-stripe:#00929a;--type-sky-block:#c8eafe;--type-sky-stripe:#3a8bb4;--type-sky-text:#2c5267;--type-blue-stripe:#2d84e0;--type-indigo-stripe:#7377e1;--type-violet-stripe:#9b66e6;--type-magenta-stripe:#bb59c1;--type-pink-stripe:#cf588d;--type-brown-stripe:#a2795e;--type-slate-stripe:#738497;position:relative;overflow:hidden;background:var(--surface);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}

.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center;flex:none}
.ab{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;box-sizing:border-box}
.ab h1{margin:0;padding-left:4px;font:500 22px/28px var(--ff);flex:1 1 auto;min-width:0}
.body{position:absolute;left:0;right:0;padding:8px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.grp{display:flex;flex-direction:column;gap:6px}
.lbl{font:500 13px/18px var(--ff);color:var(--text-muted)}
.cap{font:400 13px/18px var(--ff);color:var(--text-muted)}
.box{min-height:56px;box-sizing:border-box;padding:0 16px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline);display:flex;align-items:center;gap:8px;font:400 15px/22px var(--ff);color:var(--text)}
.names{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.opts{border-radius:12px;box-shadow:inset 0 0 0 1px var(--divider);overflow:hidden}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;border:0;background:transparent;color:var(--text);text-align:left;width:100%;font:400 15px/22px var(--ff);position:relative;box-sizing:border-box}
.opt + .opt::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:1px solid var(--divider)}
.opt.on{background:var(--surface-alt)}
.opt .ot{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.rd{width:20px;height:20px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--outline);flex:none;box-sizing:border-box;position:relative}
.rd.on{box-shadow:inset 0 0 0 2px var(--primary)}
.rd.on::after{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:999px;background:var(--primary)}
.note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font:400 13px/18px var(--ff);background:var(--surface-alt);color:var(--text);margin-top:-8px}
.note .ms{font-size:18px;flex:none;color:var(--text-muted)}
.sws{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px 0}
.swt{height:48px;border:0;padding:0;background:transparent;display:grid;place-items:center}
.swt span{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--surface)}
.swt span .ms{font-size:20px;font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 20}
.swt.on span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.prev{background:var(--bg);border-radius:12px;padding:8px}
.b{position:relative;box-sizing:border-box;border-radius:6px;padding:4px 6px 4px 9px;overflow:hidden;height:53px;background:var(--type-sky-block);color:var(--type-sky-text)}
.b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--type-sky-stripe)}
.n{font:500 13px/16px var(--ff)}
.m{font:400 13px/16px var(--ff);font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--divider);display:flex;gap:8px;box-sizing:border-box}
.btn{height:48px;padding:0 20px;border:0;border-radius:12px;font:500 15px/22px var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;flex:1 1 auto}
.b-main{background:var(--primary);color:var(--on-primary)}
</style>
