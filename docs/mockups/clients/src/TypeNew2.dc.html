<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый тип — оплата и дневник</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&amp;display=block">
<style>
body{margin:0}
.scr{--ff:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#f3efe6;--surface:#fbfaf7;--surface-alt:#eae6dc;--divider:#dcd9d0;--outline:#86837b;--text:#15171a;--text-muted:#69665e;--primary:#15171a;--on-primary:#f3efe6;position:relative;overflow:hidden;background:var(--surface);color:var(--text);font:400 15px/22px var(--ff);-webkit-font-smoothing:antialiased}
.scr.dk{--bg:#15171a;--surface:#1e2124;--surface-alt:#2a2d31;--divider:#34373b;--outline:#72767c;--text:#f3efe6;--text-muted:#98958d;--primary:#f3efe6;--on-primary:#15171a}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}
.ib{width:48px;height:48px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--text);display:inline-grid;place-items:center;flex:none}
.ab{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;box-sizing:border-box;background:var(--surface);border-bottom:1px solid var(--divider)}
.ab h1{margin:0;padding-left:4px;font:500 22px/28px var(--ff);flex:1 1 auto;min-width:0}
.body{position:absolute;left:0;right:0;padding:16px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.grp{display:flex;flex-direction:column;gap:6px}
.lbl{font:500 13px/18px var(--ff);color:var(--text-muted)}
.cap{font:400 13px/18px var(--ff);color:var(--text-muted)}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.ch{height:36px;padding:0 14px;border:0;border-radius:8px;background:var(--surface-alt);color:var(--text);font:500 13px/18px var(--ff);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ch.on{background:var(--primary);color:var(--on-primary);padding-left:10px}
.ch .ms{font-size:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:40px;padding:2px;gap:2px;border-radius:12px;background:var(--surface-alt);box-sizing:border-box}
.seg button{border:0;border-radius:10px;background:transparent;color:var(--text);font:500 13px/18px var(--ff);display:flex;align-items:center;justify-content:center;padding:0 4px;white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:12px;min-height:64px;padding:0;border:0;background:transparent;color:var(--text);text-align:left;width:100%;font:400 15px/22px var(--ff);position:relative}
.opt + .opt::before{content:"";position:absolute;top:0;left:0;right:0;border-top:1px solid var(--divider)}
.opt .ot{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.opt.c{min-height:56px}
.opt.c + .opt.c::before{left:36px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--surface-alt);box-shadow:inset 0 0 0 2px var(--outline);position:relative;flex:none;box-sizing:border-box}
.sw::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:999px;background:var(--outline)}
.cb{width:20px;height:20px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--outline);flex:none;display:grid;place-items:center;margin:0 2px;box-sizing:border-box}
.cb.on{background:var(--primary);box-shadow:none;color:var(--on-primary)}
.cb .ms{font-size:18px}
.note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font:400 13px/18px var(--ff);background:var(--surface-alt);color:var(--text)}
.note .ms{font-size:18px;flex:none;color:var(--text-muted)}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--divider);display:flex;gap:8px;box-sizing:border-box}
.btn{height:48px;padding:0 20px;border:0;border-radius:12px;font:500 15px/22px var(--ff);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;flex:1 1 auto}
.b-main{background:var(--primary);color:var(--on-primary)}
</style>
</helmet>
<div class="scr {{t}}" style="width: 412px; height: 960px">

  <div class="ab">
    <button class="ib" type="button" aria-label="Закрыть"><span class="ms">close</span></button>
    <h1>Новый тип</h1>
  </div>

  <div class="body" style="top: 64px; bottom: 88px">
    <div class="grp">
      <span class="lbl">Длительность, мин</span>
      <div class="chs">
        <button class="ch" type="button">30</button>
        <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>45</button>
        <button class="ch" type="button">50</button>
        <button class="ch" type="button">60</button>
        <button class="ch" type="button">90</button>
        <button class="ch" type="button">Своя</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Клиентов на тренировке</span>
      <div class="chs">
        <button class="ch on" type="button" aria-pressed="true"><span class="ms">check</span>Сколько угодно</button>
        <button class="ch" type="button">Не больше…</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Оплата</span>
      <div class="seg" role="radiogroup" aria-label="Оплата">
        <button type="button" role="radio" aria-checked="false">За тренировку</button>
        <button class="on" type="button" role="radio" aria-checked="true">За клиента</button>
        <button type="button" role="radio" aria-checked="false">За час</button>
      </div>
    </div>

    <div class="opts">
      <button class="opt" type="button" role="switch" aria-checked="false"><span class="ot"><span>Считать как ПТ</span><span class="cap">Идёт в счётчик ПТ и в ступень месяца</span></span><span class="sw"></span></button>
      <button class="opt" type="button" role="switch" aria-checked="false"><span class="ot"><span>Ставка зависит от ступени</span><span class="cap">Своя ставка при 1–100, 101–150 и 151+ ПТ</span></span><span class="sw"></span></button>
    </div>

    <div class="grp">
      <span class="lbl">Дневник</span>
      <div class="opts">
        <button class="opt c" type="button" role="checkbox" aria-checked="true"><span class="cb on"><span class="ms">check</span></span><span class="ot"><span>План</span></span></button>
        <button class="opt c" type="button" role="checkbox" aria-checked="true"><span class="cb on"><span class="ms">check</span></span><span class="ot"><span>Факт</span></span></button>
        <button class="opt c" type="button" role="checkbox" aria-checked="false"><span class="cb"></span><span class="ot"><span>Поведение</span><span class="cap">У групп обычно не ведут</span></span></button>
      </div>
    </div>

    <div class="note"><span class="ms">info</span><span>Ставку задайте в «Ставках». Пока её нет, тренировки этого типа будут в «Нужно сделать».</span></div>
  </div>

  <div class="bar"><button class="btn b-main" type="button">Сохранить</button></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":412,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { t: (this.props.dark ?? false) ? 'dk' : 'lt' };
  }
}
</script>
</body>
</html>
